<div class="container mx-auto py-12">
  <h1 class="mb-8 text-4xl font-bold">Saved Jobs</h1>

  @if (savedJobs().length === 0) {
    <div class="rounded-xl bg-slate-100 p-10 text-center">
      <h2 class="text-2xl font-semibold">No Saved Jobs</h2>

      <p class="mt-3 text-slate-600">Save jobs to view them here.</p>
    </div>

  } @else {
    <div class="grid gap-6 md:grid-cols-2 xl:grid-cols-3">
      @for (job of savedJobs(); track job.id) {
        <app-job-card [job]="job"> </app-job-card>
      }
    </div>
  }
</div>
