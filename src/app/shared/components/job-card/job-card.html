<div class="flex gap-3">
  <a
    [routerLink]="['/jobs', job().id]"
    class="flex-1 rounded-xl bg-indigo-600 py-3 text-center font-medium text-white hover:bg-indigo-700"
  >
    View Details
  </a>

  <button
    (click)="toggleSaved()"
    class="rounded-xl border border-slate-300 px-4 hover:bg-slate-100"
  >
    @if (savedJobService.isSaved(job().id)) {
      ❤️
    } @else {
      🤍
    }
  </button>
</div>
